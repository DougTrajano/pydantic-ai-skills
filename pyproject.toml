[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[project]
name = "pydantic-ai-skills"
dynamic = ["version"]
description = "Remote skill registries and bundled-file execution for Pydantic AI Agent Skills"
authors = [
    { name = "Douglas Trajano", email = "douglas.trajano@outlook.com" },
]
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules"
]
requires-python = ">=3.10"
dependencies = [
    "anyio>=4.0.0",
    # The harness owns Agent Skills discovery, SKILL.md validation and instruction
    # injection; this package layers remote sources and bundled files on top. 0.28 is
    # the floor because that is the oldest release whose `Skills` public surface matches
    # what `SkillsCapability` re-emits (pinned by tests/test_harness_compat.py).
    "pydantic-ai-harness[skills]>=0.28",
    # Raised from >=1.105 in 2.0. 2.38 is the floor, not 2.37 (pydantic-ai-harness's own
    # floor at 0.28): `AbstractCapability.visit_and_replace` only exists from 2.38, and
    # SkillsCapability must override it alongside `apply` or its skill leaves are invisible
    # to callers rewriting the capability tree. `RunContext.active_capability_ids`, used to
    # gate the skill-file tools, needs 2.35. Caught by the test-lowest-versions CI job.
    "pydantic-ai-slim>=2.38",
    # 6.0.1 is the floor, not 6.0: pyyaml 6.0 ships no wheels for Python 3.12+
    # and its sdist fails to build against Cython 3 ("build_ext has no attribute
    # cython_sources"). Caught by the test-lowest-versions CI job.
    "pyyaml>=6.0.1",
]

[project.urls]
Homepage = "https://github.com/dougtrajano/pydantic-ai-skills"
Source = "https://github.com/dougtrajano/pydantic-ai-skills"

[project.optional-dependencies]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-material>=9.7.1",
    "mkdocs-material-extensions>=1.3.1",
    "mkdocstrings[python]>=1.0.0",
    "mkdocs-tooltips>=0.1.0",
    "mkdocs-section-index>=0.3.10",
    "mkdocs-git-revision-date-localized-plugin>=1.5.0",
    "mkdocs-llmstxt>=0.2.0",
]
git = [
    "gitpython>=3.1.0",
]
s3 = [
    "boto3>=1.26.0",
]
opensandbox = [
    "opensandbox>=0.1.15",
]
localsandbox = [
    # localsandbox requires Python >=3.12 while this project supports >=3.10, so
    # the marker keeps the extra resolvable on 3.10/3.11 (where it installs
    # nothing and LocalSandboxScriptExecutor raises a clear ImportError).
    "localsandbox>=0.3.2; python_version >= '3.12'",
]
test = [
    "pytest>=8.0.0",
    # 0.23.5 is the floor, not 0.23.0: earlier 0.23.x crashes at collection
    # against pytest 8 ("'Package' object has no attribute 'obj'").
    # Caught by the test-lowest-versions CI job.
    "pytest-asyncio>=0.23.5",
    "pytest-cov>=4.1.0",
    "types-PyYAML>=6.0.12",
]
dev = [
    "ruff>=0.15.0",
    "pre-commit>=4.6.0",
    "mypy>=2.3.0",
    "black>=26.5.0",
    "isort>=8.0.0",
]
examples = [
    "uvicorn>=0.46.0",
    "python-dotenv>=1.2.0",
    "httpx>=0.28.0",
    "datasets>=4.8.0",
    "arxiv>=3.0.0",
    "logfire>=4.32.0",
    "gitpython>=3.1.0",
    "langchain-community>=0.4.0",
    "ddgs>=9.14.0",
    "pydantic-ai-slim[mcp,openai,logfire]>=2.38",
]

[tool.ruff]
line-length = 120
target-version = "py310"
include = ["pydantic_ai_skills/**/*.py", "examples/**/*.py", "tests/**/*.py"]

[tool.ruff.lint]
extend-select = [
    "Q",
    "RUF100",
    "C90",
    "UP",
    "I",
    "D",
]
flake8-quotes = { inline-quotes = "single", multiline-quotes = "double" }
mccabe = { max-complexity = 15 }
ignore = [
    "D100", # ignore missing docstring in module
    "D102", # ignore missing docstring in public method
    "D104", # ignore missing docstring in public package
    "D105", # ignore missing docstring in magic methods
    "D107", # ignore missing docstring in __init__ methods
]

[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = ["pydantic_ai_skills"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint.per-file-ignores]
"examples/**/*.py" = ["D101", "D103"]

[tool.hatch.version]
# Version comes from the git tag (e.g. 1.4.0) so releases never need a commit
# back to main. fallback-version covers builds from a tarball with no git data.
source = "vcs"
fallback-version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["pydantic_ai_skills"]

[tool.coverage.run]
# Emit repo-root-relative file paths (e.g. pydantic_ai_skills/registries/s3.py)
# so SonarCloud can map coverage entries onto the indexed sources. Without this,
# coverage.xml records paths relative to the package dir (registries/s3.py),
# which Sonar resolves from the repo root and fails to match -> 0% coverage.
relative_files = true
source = ["pydantic_ai_skills"]

[tool.mypy]
# Kept here rather than in .pre-commit-config.yaml args so a bare `mypy` run
# behaves the same as the pre-commit hook and CI.
ignore_missing_imports = true
strict_optional = false
