repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-added-large-files
        args:
          - "--maxkb=1024"
        exclude: ^docs/assets/(basic_usage|advanced_usage|programmatic_skills)\.mp4$
      - id: check-docstring-first
      - id: check-executables-have-shebangs
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-yaml
        exclude: ^mkdocs\.yml$
      - id: check-json
      - id: check-toml
      - id: debug-statements
      - id: detect-aws-credentials
        args:
          - "--allow-missing-credentials"
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
      - id: requirements-txt-fixer
      - id: trailing-whitespace
  - repo: https://github.com/asottile/pyupgrade
    rev: v3.19.1
    hooks:
      - id: pyupgrade
        args:
          - "--py312-plus"
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.2
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  # Workflow linting. Agents write and edit CI workflows too, and a workflow is
  # the one file in the repo the test suite cannot exercise: actionlint catches
  # the syntax and expression errors, zizmor the security ones (script injection
  # through a branch name, over-broad permissions, credential persistence).
  - repo: https://github.com/rhysd/actionlint
    rev: v1.7.12
    hooks:
      - id: actionlint
  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: v1.29.0
    hooks:
      - id: zizmor
        # The online audits need a GitHub token, which a contributor's machine has
        # no reason to hold; the offline set is what both local and CI runs share.
        # Configuration lives in .github/zizmor.yml.
        args: ["--no-progress", "--offline", "--persona=regular"]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        additional_dependencies:
          - types-requests
          - types-PyYAML
        args: [--ignore-missing-imports, --no-strict-optional]
