name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  # PRs cancel their own superseded runs. Pushes get a group keyed on run_id so
  # one commit to main never cancels the run for the previous one.
  group: ci-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: Lint (pre-commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - uses: pre-commit/action@v3.0.1

  test:
    name: Test (Python ${{ matrix.python-version }}, deps ${{ matrix.deps }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        # `floor` pins pydantic-ai-harness and pydantic-ai-slim to the oldest pair this
        # package declares support for; the two move together because harness sets its
        # own pydantic-ai-slim floor. `latest` tracks whatever is on PyPI today.
        deps: ["floor", "latest"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv pip install --system -e ".[test,git]"

      - name: Select pydantic-ai / harness versions
        run: |
          if [ "${{ matrix.deps }}" = "latest" ]; then
            uv pip install --system --upgrade "pydantic-ai-harness[skills]" pydantic-ai-slim
          else
            uv pip install --system "pydantic-ai-harness[skills]==0.28.1" "pydantic-ai-slim==2.38.0"
          fi
          uv pip show pydantic-ai-harness | grep -i '^version'
          uv pip show pydantic-ai-slim | grep -i '^version'

      - name: Run pytest with coverage
        run: pytest --cov-report=xml

      - name: Upload coverage artifact
        if: matrix.python-version == '3.12' && matrix.deps == 'latest'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_id }}
          path: coverage.xml
          retention-days: 7

      - name: Save PR metadata
        if: matrix.python-version == '3.12' && matrix.deps == 'latest'
        run: |
          echo "PR_NUMBER=${{ github.event.pull_request.number }}" > pr-metadata.env
          echo "PR_HEAD_SHA=${{ github.event.pull_request.head.sha }}" >> pr-metadata.env
          echo "PR_BASE_REF=${{ github.event.pull_request.base.ref }}" >> pr-metadata.env
          echo "PR_HEAD_REF=${{ github.event.pull_request.head.ref }}" >> pr-metadata.env

      - name: Upload PR metadata artifact
        if: matrix.python-version == '3.12' && matrix.deps == 'latest'
        uses: actions/upload-artifact@v7
        with:
          name: pr-metadata-${{ github.run_id }}
          path: pr-metadata.env
          retention-days: 7

  test-lowest-versions:
    # Resolves every direct dependency to its declared floor (anyio>=4.0.0,
    # pydantic-ai-harness>=0.28, pydantic-ai-slim>=2.38, pyyaml>=6.0.1) so a floor we no
    # longer actually support fails here instead of in a user's environment.
    name: Test lowest direct versions (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies at their lowest declared versions
        run: uv pip install --system --resolution lowest-direct -e ".[test,git]"

      - name: Show resolved versions
        run: uv pip freeze

      - name: Run pytest
        run: pytest --no-cov

  build:
    # Catches packaging breakage on the PR that causes it, rather than on
    # release day when pypi-publish.yml runs the build for the first time.
    name: Build distributions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # hatch-vcs derives the version from the git tag history.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7

      - name: Build sdist and wheel
        run: uv build

      - name: Check distribution metadata
        run: uvx twine check --strict dist/*

      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.run_id }}
          path: dist/
          retention-days: 7

  docs:
    # gh-pages.yml only builds on push to main, so without this a docs break
    # is invisible until it has already been merged.
    name: Build docs (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # The git-revision-date-localized plugin needs full history.
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v7

      - name: Install dependencies
        run: uv pip install --system -e ".[docs]"

      - name: Build docs
        run: mkdocs build --strict

  check:
    # The single required status check for branch protection. Keeping the
    # matrix job names out of branch protection means the matrix can change
    # without a settings change, and a job that never runs still fails here.
    name: Check
    if: always()
    needs: [lint, test, test-lowest-versions, build, docs]
    runs-on: ubuntu-latest
    steps:
      - name: Verify all jobs succeeded
        uses: re-actors/alls-green@release/v1
        with:
          jobs: ${{ toJSON(needs) }}
