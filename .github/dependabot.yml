# Dependabot version updates.
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "pip" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    # Wait a week before proposing a freshly published release. A compromised
    # package is usually caught and yanked within days, and nothing here needs an
    # upgrade the hour it lands.
    cooldown:
      default-days: 7

  # The workflows pin actions by tag rather than commit hash (see
  # .github/zizmor.yml). That is only safe while something keeps the tags moving
  # forward — this is that something.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
